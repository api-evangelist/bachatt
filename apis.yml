aid: bachatt
name: Bachatt
description: 'Bachatt is a daily savings and investments mobile app operated by Trusave Fintech Private Limited,
  designed for India''s underserved and self-employed population. As an AMFI-registered mutual fund distributor,
  Bachatt lets users save from as little as INR 100/day and invest in liquid mutual funds (Insta Fund) with
  instant withdrawal, curated mutual fund baskets (Bachatt Wealth), gold and silver mutual funds, fixed deposits,
  and access instant personal and business loans (Insta Loans) up to INR 5 lakhs. The company partners with
  major AMCs including SBI, ICICI Prudential, Axis, and HDFC and delivers everything through a single UPI-powered
  mobile application on Android and iOS. Bachatt is backed by Accel. This profile is maintained in the API
  Evangelist network; Bachatt is a consumer fintech app and does not currently publish a public developer API.'
